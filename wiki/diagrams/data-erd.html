<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Core Data Models — RUN APPAREL CMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #fafaf9;
      --ink: #1c1917;
      --muted: #78716c;
      --accent: #d4a853;
      --hairline: #d6d3d1;
      --blue: #0047ab;
      --success: #00c97b;
      --card-bg: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--paper);
      color: var(--ink);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .diagram-container {
      width: 100%;
      max-width: 1320px;
      background: var(--card-bg);
      border: 1px solid var(--hairline);
      border-radius: 4px;
      padding: 2rem 2.5rem 2.25rem;
    }

    .diagram-header {
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--hairline);
      padding-bottom: 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .header-titles h1 {
      font-family: "Inter", sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink);
      margin-bottom: 0.25rem;
    }

    .header-titles p {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.8125rem;
      color: var(--muted);
      letter-spacing: -0.01em;
    }

    .header-legend {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: var(--paper);
      border: 1px solid var(--hairline);
      padding: 0.4rem 0.85rem;
      border-radius: 3px;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.75rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .pill {
      font-size: 0.65rem;
      font-weight: 700;
      padding: 0.1rem 0.35rem;
      border-radius: 2px;
    }
    .pill-pk { background: rgba(212, 168, 83, 0.2); color: #9e731b; }
    .pill-uk { background: rgba(0, 71, 171, 0.12); color: var(--blue); }
    .pill-fk { background: rgba(120, 113, 108, 0.15); color: #57534e; }

    svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .diagram-footer {
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid var(--hairline);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .footer-stat {
      display: flex;
      gap: 1.5rem;
    }
  </style>
</head>
<body>

  <main class="diagram-container">
    <header class="diagram-header">
      <div class="header-titles">
        <h1>Core Data Models</h1>
        <p>Source of truth: shared/schemas/ · Drizzle ORM + drizzle-zod</p>
      </div>
      <div class="header-legend">
        <div class="legend-item">
          <span class="pill pill-pk">PK</span>
          <span>Primary Key</span>
        </div>
        <div class="legend-item">
          <span class="pill pill-uk">UK</span>
          <span>Unique</span>
        </div>
        <div class="legend-item">
          <span class="pill pill-fk">FK</span>
          <span>Foreign Key</span>
        </div>
        <div class="legend-item" style="color: var(--muted); margin-left: 0.25rem;">
          <span>—&lt; Crow's Foot (1:N / M:N)</span>
        </div>
      </div>
    </header>
