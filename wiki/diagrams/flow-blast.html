<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B.L.A.S.T. Execution Protocol — RUN APPAREL Factory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #fafaf9;
      color: #1c1917;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .diagram-container {
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      background: #fafaf9;
    }
    svg {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="diagram-container">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" width="100%" height="100%" role="img" aria-labelledby="blast-title blast-desc">
      <title id="blast-title">B.L.A.S.T. Execution Protocol</title>
      <desc id="blast-desc">Five-stage deterministic engineering pipeline for RUN APPAREL CMS: Blueprint, Link, Architect, Stylize, and Trigger, with color-tinted stages and strict technical integrity gates.</desc>

      <defs>
        <!-- Directional arrow between stages -->
        <marker id="blast-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#78716c"/>
        </marker>
        <marker id="blast-arrow-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d4a853"/>
        </marker>
      </defs>

      <!-- Background Canvas -->
      <rect width="1280" height="620" fill="#fafaf9"/>

      <!-- ================= HEADER SECTION ================= -->
      <g id="header" transform="translate(60, 42)">
        <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="1.5" fill="#78716c">FACTORY STANDARD // RUN APPAREL CMS</text>
        
        <!-- Standard Badge -->
        <rect x="1010" y="-14" width="150" height="26" fill="#ffffff" stroke="#d6d3d1" stroke-width="1" rx="2"/>
        <circle cx="1024" cy="-1" r="3.5" fill="#d4a853"/>
        <text x="1036" y="3" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#1c1917" letter-spacing="0.5">SOP-ENG-01</text>

        <!-- Main Title -->
        <text x="0" y="34" font-family="'Inter', sans-serif" font-size="24" font-weight="700" fill="#1c1917" letter-spacing="-0.5">B.L.A.S.T. Execution Protocol</text>
        
        <!-- Subtitle -->
        <text x="0" y="58" font-family="'Inter', sans-serif" font-size="13.5" font-weight="400" fill="#78716c">Deterministic engineering methodology — no exceptions</text>

        <!-- Hairline Divider -->
        <line x1="0" y1="76" x2="1160" y2="76" stroke="#d6d3d1" stroke-width="1"/>
      </g>

      <!-- ================= STAGES PIPELINE ================= -->

      <!-- Stage 1: B - BLUEPRINT (Blue Tint) -->
      <g id="stage-blueprint" transform="translate(60, 140)">
        <!-- Card Container -->
        <rect x="0" y="0" width="210" height="340" fill="#ffffff" stroke="#d6d3d1" stroke-width="1" rx="3"/>
        <!-- Stage Top Stripe: Blue -->
        <rect x="0" y="0" width="210" height="4" fill="#0047ab" rx="1"/>
        
        <!-- Stage Header Tag -->
        <text x="16" y="26" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#78716c" letter-spacing="0.5">STAGE 01</text>

        <!-- Letter Glyph Box: Blue Tint -->
        <rect x="16" y="36" width="46" height="46" fill="#f0f6ff" stroke="#0047ab" stroke-width="1.5" rx="3"/>
        <text x="39" y="69" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#0047ab">B</text>

        <!-- Stage Title -->
        <text x="70" y="56" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#1c1917">BLUEPRINT</text>
        <text x="70" y="74" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="500" fill="#0047ab">Discovery</text>

        <!-- Hairline Divider -->
        <line x1="16" y1="94" x2="194" y2="94" stroke="#d6d3d1" stroke-width="1"/>

        <!-- Subtitle / Mission -->
        <text x="16" y="116" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#1c1917">Read schemas, routes,</text>
        <text x="16" y="132" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#1c1917">types &amp; config</text>

        <!-- Checklist -->
        <g transform="translate(16, 154)">
          <rect x="0" y="0" width="178" height="162" fill="#fafaf9" stroke="#d6d3d1" stroke-width="0.75" rx="2"/>
          
          <text x="10" y="22" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#78716c">CHECKLIST</text>
          
          <circle cx="14" cy="44" r="2" fill="#0047ab"/>
          <text x="24" y="48" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#1c1917">Inspect schema.ts</text>
          
          <circle cx="14" cy="74" r="2" fill="#0047ab"/>
          <text x="24" y="78" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#1c1917">Map route manifest</text>

          <circle cx="14" cy="104" r="2" fill="#0047ab"/>
          <text x="24" y="108" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#1c1917">Audit shared types</text>

          <circle cx="14" cy="134" r="2" fill="#0047ab"/>
          <text x="24" y="138" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#1c1917">Review app config</text>
        </g>
      </g>

      <!-- Arrow 1 -> 2 -->
      <line x1="270" y1="310" x2="292" y2="310" stroke="#78716c" stroke-width="1.5" marker-end="url(#blast-arrow)"/>

      <!-- Stage 2: L - LINK (Purple Tint) -->
      <g id="stage-link" transform="translate(298, 140)">
        <!-- Card Container -->
        <rect x="0" y="0" width="210" height="340" fill="#ffffff" stroke="#d6d3d1" stroke-width="1" rx="3"/>
        <!-- Stage Top Stripe: Purple -->
        <rect x="0" y="0" width="210" height="4" fill="#7c3aed" rx="1"/>
        
        <!-- Stage Header Tag -->
        <text x="16" y="26" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#78716c" letter-spacing="0.5">STAGE 02</text>

        <!-- Letter Glyph Box: Purple Tint -->
        <rect x="16" y="36" width="46" height="46" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" rx="3"/>
        <text x="39" y="69" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#7c3aed">L</text>

        <!-- Stage Title -->
        <text x="70" y="56" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#1c1917">LINK</text>
        <text x="70" y="74" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="500" fill="#7c3aed">Contracts</text>

        <!-- Hairline Divider -->
        <line x1="16" y1="94" x2="194" y2="94" stroke="#d6d3d1" stroke-width="1"/>

        <!-- Subtitle / Mission -->
        <text x="16" y="116" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#1c1917">Verify API contracts,</text>
        <text x="16" y="132" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#1c1917">Zod schemas &amp; env keys</text>

        <!-- Checklist -->
        <g transform="translate(16, 154)">
          <rect x="0" y="0" width="178" height="162" fill="#fafaf9" stroke="#d6d3d1" stroke-width="0.75" rx="2"/>
          
          <text x="10" y="22" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#78716c">CHECKLIST</text>
          
          <circle cx="14" cy="44" r="2" fill="#7c3aed"/>
          <text x="24" y="48" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#1c1917">Validate Zod schemas</text>
          
          <circle cx="14" cy="74" r="2" fill="#7c3aed"/>
          <text x="24" y="78" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#1c1917">Verify REST endpoints</text>

          <circle cx="14" cy="104" r="2" fill="#7c3aed"/>
          <text x="24" y="108" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#1c1917">Check env variables</text>

          <circle cx="14" cy="134" r="2" fill="#7c3aed"/>
          <text x="24" y="138" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#1c1917">Sync OpenAPI specs</text>
        </g>
      </g>

      <!-- Arrow 2 -> 3 -->
      <line x1="508" y1="310" x2="530" y2="310" stroke="#78716c" stroke-width="1.5" marker-end="url(#blast-arrow)"/>

      <!-- Stage 3: A - ARCHITECT (Orange/Warm Tint) -->
      <g id="stage-architect" transform="translate(535, 140)">
        <!-- Card Container -->
        <rect x="0" y="0" width="210" height="340" fill="#ffffff" stroke="#d6d3d1" stroke-width="1" rx="3"/>
        <!-- Stage Top Stripe: Warm Orange -->
        <rect x="0" y="0" width="210" height="4" fill="#ea580c" rx="1"/>
        
        <!-- Stage Header Tag -->
        <text x="16" y="26" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#78716c" letter-spacing="0.5">STAGE 03</text>

        <!-- Letter Glyph Box: Warm Orange Tint -->
        <rect x="16" y="36" width="46" height="46" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5" rx="3"/>
        <text x="39" y="69" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#ea580c">A</text>

        <!-- Stage Title -->
        <text x="70" y="56" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#1c1917">ARCHITECT</text>
        <text x="70" y="74" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="500" fill="#ea580c">Flow &amp; State</text>

        <!-- Hairline Divider -->
        <line x1="16" y1="94" x2="194" y2="94" stroke="#d6d3d1" stroke-width="1"/>

        <!-- Subtitle / Mission -->
        <text x="16" y="116" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#1c1917">Trace request flow,</text>
        <text x="16" y="132" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#1c1917">SSR/cache/auth patterns</text>

        <!-- Checklist -->
        <g transform="translate(16, 154)">
          <rect x="0" y="0" width="178" height="162" fill="#fafaf9" stroke="#d6d3d1" stroke-width="0.75" rx="2"/>
          
          <text x="10" y="22" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#78716c">CHECKLIST</text>
          
          <circle cx="14" cy="44" r="2" fill="#ea580c"/>
          <text x="24" y="48" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#1c1917">Trace loader data path</text>
          
          <circle cx="14" cy="74" r="2" fill="#ea580c"/>
          <text x="24" y="78" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#1c1917">Define cache TTLs</text>

          <circle cx="14" cy="104" r="2" fill="#ea580c"/>
          <text x="24" y="108" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#1c1917">CSRF &amp; session guards</text>

          <circle cx="14" cy="134" r="2" fill="#ea580c"/>
          <text x="24" y="138" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#1c1917">Error boundary tree</text>
        </g>
      </g>

      <!-- Arrow 3 -> 4 -->
      <line x1="745" y1="310" x2="767" y2="310" stroke="#78716c" stroke-width="1.5" marker-end="url(#blast-arrow)"/>

      <!-- Stage 4: S - STYLIZE (Green Tint) -->
      <g id="stage-stylize" transform="translate(773, 140)">
        <!-- Card Container -->
        <rect x="0" y="0" width="210" height="340" fill="#ffffff" stroke="#d6d3d1" stroke-width="1" rx="3"/>
        <!-- Stage Top Stripe: Green -->
        <rect x="0" y="0" width="210" height="4" fill="#00c97b" rx="1"/>
        
        <!-- Stage Header Tag -->
        <text x="16" y="26" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#78716c" letter-spacing="0.5">STAGE 04</text>

        <!-- Letter Glyph Box: Green Tint -->
        <rect x="16" y="36" width="46" height="46" fill="#f0fdf4" stroke="#00c97b" stroke-width="1.5" rx="3"/>
        <text x="39" y="69" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#00c97b">S</text>

        <!-- Stage Title -->
        <text x="70" y="56" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#1c1917">STYLIZE</text>
        <text x="70" y="74" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="500" fill="#00c97b">Form &amp; Motion</text>

        <!-- Hairline Divider -->
        <line x1="16" y1="94" x2="194" y2="94" stroke="#d6d3d1" stroke-width="1"/>

        <!-- Subtitle / Mission -->
        <text x="16" y="116" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#1c1917">Apply @theme tokens,</text>
        <text x="16" y="132" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#1c1917">GSAP patterns, a11y</text>

        <!-- Checklist -->
        <g transform="translate(16, 154)">
          <rect x="0" y="0" width="178" height="162" fill="#fafaf9" stroke="#d6d3d1" stroke-width="0.75" rx="2"/>
          
          <text x="10" y="22" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#78716c">CHECKLIST</text>
          
          <circle cx="14" cy="44" r="2" fill="#00c97b"/>
          <text x="24" y="48" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#1c1917">Apply @theme tokens</text>
          
          <circle cx="14" cy="74" r="2" fill="#00c97b"/>
          <text x="24" y="78" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#1c1917">GSAP motion curves</text>

          <circle cx="14" cy="104" r="2" fill="#00c97b"/>
          <text x="24" y="108" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#1c1917">WCAG 2.1 AA a11y</text>

          <circle cx="14" cy="134" r="2" fill="#00c97b"/>
          <text x="24" y="138" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#1c1917">Responsive viewports</text>
        </g>
      </g>

      <!-- Arrow 4 -> 5 (Gold Accent) -->
      <line x1="983" y1="310" x2="1004" y2="310" stroke="#d4a853" stroke-width="1.5" marker-end="url(#blast-arrow-gold)"/>

      <!-- Stage 5: T - TRIGGER (Accent Gold Tint) -->
      <g id="stage-trigger" transform="translate(1010, 140)">
        <!-- Card Container with Accent Gold Stroke -->
        <rect x="0" y="0" width="210" height="340" fill="#fafaf9" stroke="#d4a853" stroke-width="2" rx="3"/>
        <!-- Stage Top Stripe: Gold Accent -->
        <rect x="0" y="0" width="210" height="4" fill="#d4a853" rx="1"/>
        
        <!-- Stage Header Tag -->
        <text x="16" y="26" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#d4a853" letter-spacing="0.5">STAGE 05 // GATE</text>

        <!-- Letter Glyph Box: Gold Accent Tint -->
        <rect x="16" y="36" width="46" height="46" fill="#fefce8" stroke="#d4a853" stroke-width="2" rx="3"/>
        <text x="39" y="69" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#d4a853">T</text>

        <!-- Stage Title -->
        <text x="70" y="56" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#1c1917">TRIGGER</text>
        <text x="70" y="74" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#d4a853">Integrity Gate</text>

        <!-- Hairline Divider -->
        <line x1="16" y1="94" x2="194" y2="94" stroke="#d4a853" stroke-width="1"/>

        <!-- Subtitle / Mission -->
        <text x="16" y="116" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#1c1917">Implement, test &amp; run</text>
        <text x="16" y="132" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#d4a853">verify:tech-integrity</text>

        <!-- Checklist -->
        <g transform="translate(16, 154)">
          <rect x="0" y="0" width="178" height="162" fill="#ffffff" stroke="#d4a853" stroke-width="1" rx="2"/>
          
          <text x="10" y="22" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#d4a853">FINAL VERIFICATION</text>
          
          <circle cx="14" cy="44" r="2" fill="#d4a853"/>
          <text x="24" y="48" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#1c1917">Vitest unit &amp; e2e</text>
          
          <circle cx="14" cy="74" r="2" fill="#d4a853"/>
          <text x="24" y="78" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#1c1917">verify:tech-integrity</text>

          <circle cx="14" cy="104" r="2" fill="#d4a853"/>
          <text x="24" y="108" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#1c1917">Zero anti-patterns</text>

          <circle cx="14" cy="134" r="2" fill="#00c97b"/>
          <text x="24" y="138" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#00c97b">READY TO MERGE</text>
        </g>
      </g>

      <!-- ================= FOOTER / PROTOCOL NOTE ================= -->
      <g id="footer" transform="translate(60, 520)">
        <line x1="0" y1="0" x2="1160" y2="0" stroke="#d6d3d1" stroke-width="1"/>
        
        <g transform="translate(0, 20)">
          <text x="0" y="6" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#d4a853">RULE OF THE FACTORY:</text>
          <text x="160" y="6" font-family="'Inter', sans-serif" font-size="11.5" font-weight="400" fill="#78716c">No implementation begins without Blueprint &amp; Architecture. No pull request merges without Stage T integrity verification.</text>
          <text x="1160" y="6" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="500" fill="#78716c">BLAST v4.1</text>
        </g>
      </g>
    </svg>
  </div>
</body>
</html>
