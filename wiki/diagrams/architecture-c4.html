<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RUN Remix — System Context (C4 Level 1) — RUN APPAREL CMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #fafaf9;
      --ink: #1c1917;
      --muted: #78716c;
      --accent: #d4a853;
      --hairline: #d6d3d1;
      --blue: #0047ab;
      --success: #00c97b;
      --card-bg: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--paper);
      color: var(--ink);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1.5rem;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .diagram-container {
      width: 100%;
      max-width: 1200px;
      background: var(--card-bg);
      border: 1px solid var(--hairline);
      border-radius: 4px;
      padding: 2rem 2.5rem 2.25rem;
    }

    .diagram-header {
      margin-bottom: 1.5rem;
      border-bottom: 1px solid var(--hairline);
      padding-bottom: 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .header-titles h1 {
      font-family: "Inter", sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink);
      margin-bottom: 0.25rem;
    }

    .header-titles p {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.8125rem;
      color: var(--muted);
      letter-spacing: -0.01em;
    }

    .header-badge {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--ink);
      background: #fafaf9;
      border: 1px solid var(--hairline);
      padding: 0.35rem 0.75rem;
      border-radius: 2px;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .header-badge .badge-icon {
      color: var(--accent);
      font-weight: 700;
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .text-title {
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 700;
      fill: var(--ink);
    }
    .text-subtitle {
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 400;
      fill: var(--muted);
    }
    .text-label {
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 600;
      fill: var(--ink);
    }
    .text-body {
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 400;
      fill: var(--muted);
    }
    .text-mono {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 500;
      fill: var(--muted);
    }
    .text-mono-bold {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
      fill: var(--ink);
    }

    .diagram-footer {
      margin-top: 1.25rem;
      padding-top: 1rem;
      border-top: 1px solid var(--hairline);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.75rem;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .footer-stat {
      display: flex;
      gap: 1.5rem;
    }
  </style>
</head>
<body>
