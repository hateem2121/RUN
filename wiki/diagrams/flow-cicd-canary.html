<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Production Canary Rollout — RUN APPAREL CI/CD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #fafaf9;
      color: #1c1917;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .diagram-container {
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      background: #fafaf9;
    }
    svg {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="diagram-container">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 840" width="100%" height="100%" role="img" aria-labelledby="diagram-title diagram-desc">
      <title id="diagram-title">Production Canary Rollout Pipeline</title>
      <desc id="diagram-desc">Horizontal flowchart displaying the three-phase CI/CD canary deployment pipeline on Google Cloud Build, featuring build verification, pre-deploy Drizzle DB migrations, canary deployment, and progressive traffic shifting with health gates.</desc>

      <defs>
        <!-- Marker definitions for crisp directional arrows -->
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#78716c"/>
        </marker>
        <marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d4a853"/>
        </marker>
      </defs>

      <!-- Background Canvas -->
      <rect width="1280" height="840" fill="#fafaf9"/>

      <!-- ================= HEADER SECTION ================= -->
      <g id="header" transform="translate(60, 42)">
        <!-- Brand kicker -->
        <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" letter-spacing="1.5" fill="#78716c">RUN APPAREL // ARCHITECTURE &amp; DEPLOYMENT</text>
        
        <!-- Platform badge -->
        <rect x="1000" y="-14" width="160" height="26" fill="#ffffff" stroke="#d6d3d1" stroke-width="1" rx="2"/>
        <circle cx="1014" cy="-1" r="3.5" fill="#0047ab"/>
        <text x="1026" y="3" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#1c1917" letter-spacing="0.5">Google Cloud Build</text>

        <!-- Main Title -->
        <text x="0" y="34" font-family="'Inter', sans-serif" font-size="24" font-weight="700" fill="#1c1917" letter-spacing="-0.5">Production Canary Rollout</text>
        
        <!-- Subtitle -->
        <text x="0" y="58" font-family="'Inter', sans-serif" font-size="13.5" font-weight="400" fill="#78716c">Progressive traffic shifting with automated health gates</text>

        <!-- Hairline Divider -->
        <line x1="0" y1="76" x2="1160" y2="76" stroke="#d6d3d1" stroke-width="1"/>
      </g>

      <!-- ================= PHASE 1: BUILD ================= -->
      <g id="phase-1" transform="translate(60, 145)">
        <!-- Phase Container Card -->
        <rect x="0" y="0" width="1160" height="155" fill="#ffffff" stroke="#d6d3d1" stroke-width="1" rx="3"/>
        
        <!-- Phase Header Tab -->
        <path d="M 0 3 Q 0 0 3 0 L 240 0 L 255 26 L 0 26 Z" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1"/>
        <line x1="0" y1="26" x2="1160" y2="26" stroke="#d6d3d1" stroke-width="1"/>
        <circle cx="18" cy="13" r="3" fill="#0047ab"/>
        <text x="30" y="17" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#1c1917" letter-spacing="0.8">PHASE 01 // BUILD</text>

        <!-- Step 1: npm ci -->
        <g transform="translate(24, 44)">
          <rect x="0" y="0" width="220" height="88" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1" rx="2"/>
          <text x="14" y="22" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#78716c" letter-spacing="0.5">STEP 01</text>
          <text x="14" y="46" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#1c1917">npm ci</text>
          <text x="14" y="68" font-family="'Inter', sans-serif" font-size="11.5" font-weight="400" fill="#78716c">Clean dependency install</text>
        </g>

        <!-- Arrow 1 -> 2 -->
        <line x1="244" y1="88" x2="282" y2="88" stroke="#78716c" stroke-width="1" marker-end="url(#arrow)"/>

        <!-- Step 2: verify:tech-integrity -->
        <g transform="translate(290, 44)">
          <rect x="0" y="0" width="240" height="88" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1" rx="2"/>
          <text x="14" y="22" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#78716c" letter-spacing="0.5">STEP 02</text>
          <text x="14" y="46" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#1c1917">verify:tech-integrity</text>
          <text x="14" y="68" font-family="'Inter', sans-serif" font-size="11.5" font-weight="400" fill="#78716c">Lint, types &amp; architecture check</text>
        </g>

        <!-- Arrow 2 -> 3 -->
        <line x1="530" y1="88" x2="568" y2="88" stroke="#78716c" stroke-width="1" marker-end="url(#arrow)"/>

        <!-- Step 3: check:docs -->
        <g transform="translate(576, 44)">
          <rect x="0" y="0" width="220" height="88" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1" rx="2"/>
          <text x="14" y="22" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#78716c" letter-spacing="0.5">STEP 03</text>
          <text x="14" y="46" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#1c1917">check:docs</text>
          <text x="14" y="68" font-family="'Inter', sans-serif" font-size="11.5" font-weight="400" fill="#78716c">Wiki &amp; ADR integrity sync</text>
        </g>

        <!-- Arrow 3 -> 4 -->
        <line x1="796" y1="88" x2="834" y2="88" stroke="#78716c" stroke-width="1" marker-end="url(#arrow)"/>

        <!-- Step 4: Docker Build -->
        <g transform="translate(842, 44)">
          <rect x="0" y="0" width="294" height="88" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1" rx="2"/>
          <text x="14" y="22" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#78716c" letter-spacing="0.5">STEP 04</text>
          <text x="14" y="46" font-family="'Inter', sans-serif" font-size="13.5" font-weight="600" fill="#1c1917">Docker Build</text>
          <text x="14" y="68" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="400" fill="#78716c">Multi-stage Node 24 Alpine</text>
        </g>
      </g>

      <!-- Connecting Flow: Phase 1 -> Phase 2 -->
      <path d="M 1049 300 L 1049 324 L 84 324 L 84 340" fill="none" stroke="#78716c" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

      <!-- ================= PHASE 2: DEPLOY ================= -->
      <g id="phase-2" transform="translate(60, 345)">
        <!-- Phase Container Card -->
        <rect x="0" y="0" width="1160" height="155" fill="#ffffff" stroke="#d6d3d1" stroke-width="1" rx="3"/>
        
        <!-- Phase Header Tab -->
        <path d="M 0 3 Q 0 0 3 0 L 250 0 L 265 26 L 0 26 Z" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1"/>
        <line x1="0" y1="26" x2="1160" y2="26" stroke="#d6d3d1" stroke-width="1"/>
        <circle cx="18" cy="13" r="3" fill="#0047ab"/>
        <text x="30" y="17" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#1c1917" letter-spacing="0.8">PHASE 02 // DEPLOY</text>

        <!-- Step 5: Push to Container Registry -->
        <g transform="translate(24, 44)">
          <rect x="0" y="0" width="310" height="88" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1" rx="2"/>
          <text x="14" y="22" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#78716c" letter-spacing="0.5">STEP 05</text>
          <text x="14" y="46" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#1c1917">Push to Container Registry</text>
          <text x="14" y="68" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="400" fill="#78716c">Artifact Registry (sha256 digest)</text>
        </g>

        <!-- Arrow 5 -> 6 -->
        <line x1="334" y1="88" x2="376" y2="88" stroke="#78716c" stroke-width="1" marker-end="url(#arrow)"/>

        <!-- Step 6: Drizzle DB Migration -->
        <g transform="translate(384, 44)">
          <rect x="0" y="0" width="370" height="88" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1" rx="2"/>
          <text x="14" y="22" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#78716c" letter-spacing="0.5">STEP 06</text>
          <text x="14" y="46" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#1c1917">Drizzle DB Migration</text>
          <!-- Critical ordering note -->
          <rect x="14" y="56" width="220" height="18" fill="#ffffff" stroke="#78716c" stroke-width="0.75" rx="1.5"/>
          <text x="20" y="69" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#0047ab">runs BEFORE new code!</text>
          <text x="242" y="69" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#78716c">Zero-downtime</text>
        </g>

        <!-- Arrow 6 -> 7 -->
        <line x1="754" y1="88" x2="796" y2="88" stroke="#78716c" stroke-width="1" marker-end="url(#arrow)"/>

        <!-- Step 7: Deploy Canary (ACCENT HIGHLIGHT) -->
        <g transform="translate(804, 44)">
          <!-- Golden Accent Border & Card -->
          <rect x="0" y="0" width="332" height="88" fill="#fafaf9" stroke="#d4a853" stroke-width="2" rx="2"/>
          <rect x="0" y="0" width="332" height="4" fill="#d4a853"/>
          <circle cx="18" cy="20" r="3" fill="#d4a853"/>
          <text x="28" y="23" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#d4a853" letter-spacing="0.5">STEP 07 // HIGHLIGHT</text>
          <text x="14" y="48" font-family="'Inter', sans-serif" font-size="15" font-weight="700" fill="#1c1917">Deploy Canary (no traffic)</text>
          <text x="14" y="70" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="500" fill="#78716c">traffic: 0% · isolated revision</text>
        </g>
      </g>

      <!-- Connecting Flow: Phase 2 -> Phase 3 -->
      <path d="M 970 500 L 970 522 L 84 522 L 84 540" fill="none" stroke="#78716c" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#arrow)"/>

      <!-- ================= PHASE 3: PROGRESSIVE ROLLOUT ================= -->
      <g id="phase-3" transform="translate(60, 545)">
        <!-- Phase Container Card -->
        <rect x="0" y="0" width="1160" height="210" fill="#ffffff" stroke="#d6d3d1" stroke-width="1" rx="3"/>
        
        <!-- Phase Header Tab -->
        <path d="M 0 3 Q 0 0 3 0 L 320 0 L 335 26 L 0 26 Z" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1"/>
        <line x1="0" y1="26" x2="1160" y2="26" stroke="#d6d3d1" stroke-width="1"/>
        <circle cx="18" cy="13" r="3" fill="#00c97b"/>
        <text x="30" y="17" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#1c1917" letter-spacing="0.8">PHASE 03 // PROGRESSIVE ROLLOUT</text>

        <!-- 6 Steps in horizontal progression -->
        
        <!-- Step 8: Health Check -->
        <g transform="translate(20, 44)">
          <rect x="0" y="0" width="160" height="142" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1" rx="2"/>
          <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#78716c">STEP 08</text>
          <text x="12" y="44" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#1c1917">Health Check</text>
          <text x="12" y="70" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="600" fill="#0047ab">/api/health</text>
          <text x="12" y="90" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#78716c">× 5 retries</text>
          <line x1="12" y1="104" x2="148" y2="104" stroke="#d6d3d1" stroke-width="1"/>
          <text x="12" y="124" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="500" fill="#00c97b">✓ HTTP 200 OK</text>
        </g>

        <!-- Arrow 8 -> 9 -->
        <line x1="180" y1="115" x2="204" y2="115" stroke="#78716c" stroke-width="1" marker-end="url(#arrow)"/>

        <!-- Step 9: Shift 10% Traffic -->
        <g transform="translate(210, 44)">
          <rect x="0" y="0" width="160" height="142" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1" rx="2"/>
          <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#78716c">STEP 09</text>
          <text x="12" y="44" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#1c1917">Shift 10%</text>
          <text x="12" y="60" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#1c1917">Traffic</text>
          <text x="12" y="88" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="500" fill="#1c1917">weight: 10%</text>
          <text x="12" y="106" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#78716c">Canary evaluation</text>
          <text x="12" y="126" font-family="'Inter', sans-serif" font-size="10.5" font-weight="400" fill="#78716c">Real user routing</text>
        </g>

        <!-- Arrow 9 -> 10 -->
        <line x1="370" y1="115" x2="394" y2="115" stroke="#78716c" stroke-width="1" marker-end="url(#arrow)"/>

        <!-- Step 10: Monitor 30s -->
        <g transform="translate(400, 44)">
          <rect x="0" y="0" width="160" height="142" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1" rx="2"/>
          <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#78716c">STEP 10</text>
          <text x="12" y="44" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#1c1917">Monitor 30s</text>
          <text x="12" y="70" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="500" fill="#78716c">telemetry gate</text>
          <text x="12" y="90" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#78716c">Error rate &lt; 0.1%</text>
          <line x1="12" y1="104" x2="148" y2="104" stroke="#d6d3d1" stroke-width="1"/>
          <text x="12" y="124" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="500" fill="#00c97b">✓ Latency nominal</text>
        </g>

        <!-- Arrow 10 -> 11 -->
        <line x1="560" y1="115" x2="584" y2="115" stroke="#78716c" stroke-width="1" marker-end="url(#arrow)"/>

        <!-- Step 11: Shift 50% Traffic -->
        <g transform="translate(590, 44)">
          <rect x="0" y="0" width="160" height="142" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1" rx="2"/>
          <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#78716c">STEP 11</text>
          <text x="12" y="44" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#1c1917">Shift 50%</text>
          <text x="12" y="60" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#1c1917">Traffic</text>
          <text x="12" y="88" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="500" fill="#1c1917">weight: 50%</text>
          <text x="12" y="106" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#78716c">Fleet balance</text>
          <text x="12" y="126" font-family="'Inter', sans-serif" font-size="10.5" font-weight="400" fill="#78716c">Capacity check</text>
        </g>

        <!-- Arrow 11 -> 12 -->
        <line x1="750" y1="115" x2="774" y2="115" stroke="#78716c" stroke-width="1" marker-end="url(#arrow)"/>

        <!-- Step 12: Monitor 30s -->
        <g transform="translate(780, 44)">
          <rect x="0" y="0" width="160" height="142" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1" rx="2"/>
          <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#78716c">STEP 12</text>
          <text x="12" y="44" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#1c1917">Monitor 30s</text>
          <text x="12" y="70" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="500" fill="#78716c">final soak</text>
          <text x="12" y="90" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#78716c">Memory &amp; DB load</text>
          <line x1="12" y1="104" x2="148" y2="104" stroke="#d6d3d1" stroke-width="1"/>
          <text x="12" y="124" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="500" fill="#00c97b">✓ Zero 5xx errors</text>
        </g>

        <!-- Arrow 12 -> 13 -->
        <line x1="940" y1="115" x2="964" y2="115" stroke="#d4a853" stroke-width="1.5" marker-end="url(#arrow-accent)"/>

        <!-- Step 13: Full Rollout (ACCENT HIGHLIGHT) -->
        <g transform="translate(970, 44)">
          <!-- Golden Accent Card -->
          <rect x="0" y="0" width="170" height="142" fill="#fafaf9" stroke="#d4a853" stroke-width="2" rx="2"/>
          <rect x="0" y="0" width="170" height="4" fill="#d4a853"/>
          <circle cx="14" cy="20" r="3" fill="#d4a853"/>
          <text x="24" y="23" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#d4a853">STEP 13 // HIGHLIGHT</text>
          <text x="12" y="46" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#1c1917">Full Rollout</text>
          <text x="12" y="70" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#d4a853">--to-latest</text>
          <text x="12" y="92" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#1c1917">100% Production</text>
          <line x1="12" y1="104" x2="158" y2="104" stroke="#d4a853" stroke-width="1"/>
          <text x="12" y="124" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="600" fill="#00c97b">● ACTIVE TRAFFIC</text>
        </g>
      </g>

      <!-- ================= FOOTER / LEGEND ================= -->
      <g id="footer" transform="translate(60, 785)">
        <line x1="0" y1="0" x2="1160" y2="0" stroke="#d6d3d1" stroke-width="1"/>
        
        <!-- Legend Items -->
        <g transform="translate(0, 18)">
          <rect x="0" y="-3" width="10" height="10" fill="#fafaf9" stroke="#d4a853" stroke-width="1.5" rx="1"/>
          <text x="16" y="6" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#1c1917">Accent Highlight (Deploy Canary / Full Rollout)</text>

          <rect x="330" y="-3" width="10" height="10" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1" rx="1"/>
          <text x="346" y="6" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#78716c">Automated Pipeline Step</text>

          <line x1="520" y1="2" x2="550" y2="2" stroke="#78716c" stroke-width="1" stroke-dasharray="3 3"/>
          <text x="558" y="6" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#78716c">Phase Transition</text>

          <text x="1160" y="6" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="500" fill="#78716c">FACTORY PROTOCOL // RUN-OPS-04</text>
        </g>
      </g>
    </svg>
  </div>
</body>
</html>
