title: "[Question] "
labels:
  - "question"
body:
  - type: markdown
    attributes:
      value: |
        🙋 **Have a question?** No question is too simple — we are happy to help!
        Check the [Illustrated Wiki](https://github.com/RUN-APPAREL/RUN/tree/main/docs/wiki) first, as your answer might already be there.

  - type: textarea
    id: question
    attributes:
      label: "What are you trying to do?"
      description: "Describe what you are trying to accomplish in your own words."
      placeholder: "I am trying to..."
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: "What have you tried so far?"
      description: "Tell us what steps you already took. This helps us avoid suggesting things you have already done."
      placeholder: "I tried..."
    validations:
      required: true

  - type: textarea
    id: happened
    attributes:
      label: "What happened instead?"
      description: "Did you get an error? Did nothing happen? Did something unexpected appear?"
      placeholder: "Instead of what I expected, this happened..."
    validations:
      required: false
