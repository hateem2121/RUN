version: 2
updates:
  # NPM dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
      - "automated"
    groups:
      # Group production dependencies
      production:
        patterns:
          - "express*"
          - "react*"
          - "@react-router/*"
          - "drizzle-orm"
          - "zod"
          - "neverthrow"
          - "ioredis"
          - "pino*"
          - "opossum"
        update-types:
          - "minor"
          - "patch"
      # Group dev/build tools
      dev-tools:
        patterns:
          - "@types/*"
          - "typescript"
          - "vite*"
          - "vitest"
          - "biome"
          - "@biomejs/*"
          - "turbo"
        update-types:
          - "minor"
          - "patch"
      # Group testing libraries
      testing:
        patterns:
          - "playwright*"
          - "@playwright/*"
          - "@testing-library/*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Ignore major version updates (review manually)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Ignore automated bumps for core framework & runtime stack
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-is"
      - dependency-name: "@react-router/*"
      - dependency-name: "react-router"
      - dependency-name: "express"
      - dependency-name: "drizzle-orm"
      - dependency-name: "typescript"
      - dependency-name: "vite"
      - dependency-name: "@vitejs/*"
      - dependency-name: "@biomejs/*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    labels:
      - "ci"
      - "automated"

  # Docker base images (Security: Check for CVE patches)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    commit-message:
      prefix: "docker"
    labels:
      - "dependencies"
      - "docker"
      - "security"

