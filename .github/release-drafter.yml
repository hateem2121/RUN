name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: '🚀 Features & Enhancements'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🐛 Bug Fixes'
    labels:
      - 'fix'
      - 'bugfix'
      - 'bug'
  - title: '🔒 Security & Compliance'
    labels:
      - 'security'
      - 'dependencies'
  - title: '⚡ Performance & Infrastructure'
    labels:
      - 'performance'
      - 'ci'
      - 'infrastructure'
  - title: '🧹 Maintenance & Chores'
    labels:
      - 'chore'
      - 'refactor'
      - 'docs'

change-template: '- $TITLE (#$NUMBER) @$AUTHOR'

version-resolver:
  major:
    labels:
      - 'major'
      - 'breaking'
  minor:
    labels:
      - 'minor'
      - 'feature'
  patch:
    labels:
      - 'patch'
      - 'fix'
  default: patch
