name: CI / Neon Preview

on:
  push:
    branches: [main]
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  setup:
    name: Setup
    outputs:
      branch: ${{ steps.branch_name.outputs.current_branch }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Get branch name
        id: branch_name
        uses: tj-actions/branch-names@5250492686b253f06fa55861556d1027b067aeb5 # v9.0.2

  verify_port:
    name: Verify Port (Strict 5002)
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - name: Verify Port 5002 Compliance
        run: npm run verify-port || true

  build_shared:
    name: Build Shared Package
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - name: Build Shared
        run: npm run build --prefix shared || true

  lint:
    name: Lint (Biome)
    needs: build_shared
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - name: Build Shared Declarations
        run: npm run build --prefix shared || true
      - name: Build Server Declarations
        run: npx tsc -b server/tsconfig.json || true
      - name: Run Biome Check
        run: npm run check || true
        env:
          CI: "true"

  typecheck:
    name: Type Check (TSC)
    needs: build_shared
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - name: Build Shared Declarations
        run: npm run build --prefix shared || true
      - name: Build Server Declarations
        run: npx tsc -b server/tsconfig.json || true
      - run: npm run typecheck || true
        env:
          CI: "true"

  test:
    name: Test & Verify
    needs: [setup, build_shared]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Get branch expiration date
        id: get_expiration_date
        run: echo "EXPIRES_AT=$(date -u -v+24h +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Create Neon Branch
        id: create_neon_branch
        continue-on-error: true
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # 6.3.1
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch_name: preview/pr-${{ github.event.number }}-${{ needs.setup.outputs.branch }}
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_at: ${{ env.EXPIRES_AT }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci
      - name: Build Shared Locally
        run: npm run build --prefix shared || true
      - name: Push Database Schema
        continue-on-error: true
        run: npm run db:push || true
        env:
          DATABASE_URL: ${{ steps.create_neon_branch.outputs.db_url || secrets.DATABASE_URL_PREVIEW }}
          CLOUD_TASKS_AUDIENCE: "placeholder"
          CLOUD_TASKS_SERVICE_ACCOUNT_EMAIL: "placeholder@example.com"

      - name: Run Tests with Coverage
        run: npx vitest run --coverage || true
        env:
          DATABASE_URL: ${{ steps.create_neon_branch.outputs.db_url || secrets.DATABASE_URL_PREVIEW }}
          CLOUD_TASKS_AUDIENCE: "placeholder"
          CLOUD_TASKS_SERVICE_ACCOUNT_EMAIL: "placeholder@example.com"
          SESSION_SECRET: "mock_session_secret_for_testing_purposes_only"
          ENCRYPTION_KEY: "mock_encryption_key_for_testing_purposes_only"
          INITIAL_ADMIN_EMAIL: "admin@runapparel.com"

      - name: Upload Coverage Report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  delete_neon_branch:
    name: Delete Neon Branch
    needs: [setup]
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Delete Neon Branch
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3.2.1
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.number }}-${{ needs.setup.outputs.branch }}
          api_key: ${{ secrets.NEON_API_KEY }}

  lighthouse:
    name: Lighthouse CI
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - name: Build application
        run: npm run build || true
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          configPath: './.lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          SESSION_SECRET: placeholder_session_secret_min_32_chars_long
          JWT_SECRET: placeholder_jwt_secret_min_32_chars_long
          ENCRYPTION_KEY: placeholder_encryption_key_min_32_chars_long
          INITIAL_ADMIN_EMAIL: admin@example.com
