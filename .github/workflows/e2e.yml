name: E2E Proof Suite

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-proofs:
    name: 🕵️ Forensic Proof Suite (P0/P1/P2)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🎭 Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: 🔨 Build Application
        run: npm run build

      - name: Create Neon Branch
        id: create_neon_branch
        continue-on-error: true
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # 6.3.1
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch_name: preview/e2e-${{ github.sha }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Push Database Schema
        continue-on-error: true
        run: npm run migrate:deploy || npm run db:push
        env:
          DATABASE_URL: ${{ steps.create_neon_branch.outputs.db_url }}
          SESSION_SECRET: "mock_session_secret_for_testing_purposes_only"
          ENCRYPTION_KEY: "mock_encryption_key_for_testing_purposes_only"
          INITIAL_ADMIN_EMAIL: "admin@runapparel.com"
          CLOUD_TASKS_AUDIENCE: "placeholder"
          CLOUD_TASKS_SERVICE_ACCOUNT_EMAIL: "placeholder@example.com"

      - name: "🚀 Start Production Server for E2E"
        env:
          PORT: 5002
          NODE_ENV: "production"
          ENABLE_MOCK_ADMIN: "true"
          DATABASE_URL: ${{ steps.create_neon_branch.outputs.db_url }}
          SESSION_SECRET: "mock_session_secret_for_testing_purposes_only"
          ENCRYPTION_KEY: "mock_encryption_key_for_testing_purposes_only"
          INITIAL_ADMIN_EMAIL: "admin@runapparel.com"
          CLOUD_TASKS_AUDIENCE: "placeholder"
          CLOUD_TASKS_SERVICE_ACCOUNT_EMAIL: "placeholder@example.com"
        run: |
          npm run start &
          npx wait-on http://127.0.0.1:5002/api/health --timeout 60000

      - name: "🧪 Run E2E Proof Suite"
        run: npx playwright test
        env:
          CI: true
          E2E_BASE_URL: http://127.0.0.1:5002
          ENABLE_MOCK_ADMIN: "true"
          DATABASE_URL: ${{ steps.create_neon_branch.outputs.db_url }}
          SESSION_SECRET: "mock_session_secret_for_testing_purposes_only"
          ENCRYPTION_KEY: "mock_encryption_key_for_testing_purposes_only"
          INITIAL_ADMIN_EMAIL: "admin@runapparel.com"

      - name: 📤 Upload Artifacts (Always)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-artifacts
          path: |
            e2e/artifacts/
            playwright-report/
          retention-days: 14
