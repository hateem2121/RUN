name: E2E Proof Suite

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-proofs:
    name: 🕵️ Forensic Proof Suite (P0/P1/P2)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🎭 Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: 🔨 Build Application
        run: npm run build

      - name: "🚀 Start Production Server"
        env:
          PORT: 5002
          MOCK_DB: "true"
          DATABASE_URL: postgres://mockuser:mockpass@localhost:5432/mockdb
          SESSION_SECRET: "mock_session_secret_for_testing_purposes_only"
          ENCRYPTION_KEY: "mock_encryption_key_for_testing_purposes_only"
          INITIAL_ADMIN_EMAIL: "admin@runapparel.com"
        run: |
          npm run start &
          npx wait-on http://127.0.0.1:5002/api/health --timeout 60000

      - name: "🧪 Run E2E Proof Suite"
        run: npx playwright test
        env:
          CI: true
          E2E_BASE_URL: http://127.0.0.1:5002
          MOCK_DB: "true"
          DATABASE_URL: postgres://mockuser:mockpass@localhost:5432/mockdb
          SESSION_SECRET: "mock_session_secret_for_testing_purposes_only"
          ENCRYPTION_KEY: "mock_encryption_key_for_testing_purposes_only"
          INITIAL_ADMIN_EMAIL: "admin@runapparel.com"

      - name: 📤 Upload Artifacts (Always)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-artifacts
          path: |
            e2e/artifacts/
            playwright-report/
          retention-days: 14
