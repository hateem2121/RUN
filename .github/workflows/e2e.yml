name: E2E Proof Suite

on:
  # Automated triggers disabled temporarily per sprint direction
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-proofs:
    name: 🕵️ Forensic Proof Suite (P0/P1/P2)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🎭 Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: 🔨 Build Application
        run: npm run build

      - name: Get branch expiration date
        id: get_expiration_date
        run: echo "EXPIRES_AT=$(date -u -d '+24 hours' +'%Y-%m-%dT%H:%M:%SZ' 2>/dev/null || date -u -v+24h +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Create Neon Branch
        id: create_neon_branch
        continue-on-error: true
        uses: neondatabase/create-branch-action@72ed4f69a12b6be9c16aebfad893f6a21e9aba8b # v6.4.0
        with:
          project_id: ${{ secrets.NEON_PROJECT_ID }}
          branch_name: preview/e2e-${{ github.sha }}
          api_key: ${{ secrets.NEON_API_KEY }}
          expires_at: ${{ env.EXPIRES_AT }}

      - name: Push Database Schema
        continue-on-error: true
        run: npm run migrate:deploy || npm run db:push
        env:
          DATABASE_URL: ${{ steps.create_neon_branch.outputs.db_url }}
          SESSION_SECRET: "mock_session_secret_for_testing_purposes_only"
          ENCRYPTION_KEY: "mock_encryption_key_for_testing_purposes_only"
          INITIAL_ADMIN_EMAIL: "hateem@wear-run.com"
          CLOUD_TASKS_AUDIENCE: "placeholder"
          CLOUD_TASKS_SERVICE_ACCOUNT_EMAIL: "placeholder@example.com"

      - name: "🌱 Seed Database Fixtures"
        run: npm run db:seed
        env:
          DATABASE_URL: ${{ steps.create_neon_branch.outputs.db_url }}
          SESSION_SECRET: "mock_session_secret_for_testing_purposes_only"
          ENCRYPTION_KEY: "mock_encryption_key_for_testing_purposes_only"
          INITIAL_ADMIN_EMAIL: "hateem@wear-run.com"

      - name: "🚀 Start Production Server for E2E"
        env:
          PORT: 5002
          NODE_ENV: "production"
          E2E: "true"
          ENABLE_MOCK_ADMIN: "true"
          DATABASE_URL: ${{ steps.create_neon_branch.outputs.db_url }}
          SESSION_SECRET: "mock_session_secret_for_testing_purposes_only_must_be_48_chars_long"
          ENCRYPTION_KEY: "mock_encryption_key_for_testing_purposes_only_must_be_32_chars"
          INITIAL_ADMIN_EMAIL: "hateem@wear-run.com"
          CLOUD_TASKS_AUDIENCE: "placeholder"
          CLOUD_TASKS_SERVICE_ACCOUNT_EMAIL: "placeholder@example.com"
        run: |
          npm run start &
          npx wait-on http://127.0.0.1:5002/api/health --timeout 60000

      - name: "🧪 Run E2E Proof Suite"
        run: npx playwright test --project=setup --project=chromium
        env:
          CI: true
          E2E_BASE_URL: http://127.0.0.1:5002
          ENABLE_MOCK_ADMIN: "true"
          DATABASE_URL: ${{ steps.create_neon_branch.outputs.db_url }}
          SESSION_SECRET: "mock_session_secret_for_testing_purposes_only_must_be_48_chars_long"
          ENCRYPTION_KEY: "mock_encryption_key_for_testing_purposes_only_must_be_32_chars"
          INITIAL_ADMIN_EMAIL: "hateem@wear-run.com"

      - name: 📤 Upload Artifacts (Always)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-artifacts
          path: |
            e2e/artifacts/
            playwright-report/
          retention-days: 14

      - name: 🧹 Cleanup Neon Preview Branch
        if: always() && steps.create_neon_branch.outputs.branch_id != ''
        continue-on-error: true
        run: |
          curl -s -X DELETE \
            "https://console.neon.tech/api/v2/projects/${{ secrets.NEON_PROJECT_ID }}/branches/${{ steps.create_neon_branch.outputs.branch_id }}" \
            -H "Authorization: Bearer ${{ secrets.NEON_API_KEY }}" \
            -H "Accept: application/json"
