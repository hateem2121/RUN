name: "🐛 Bug Report"
description: "Report an issue, defect, or unexpected behavior in RUN Remix"
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! 🐛 Please fill out the form below so our friendly repair team can fix it quickly.
        Before submitting, please check [open issues](https://github.com/RUN-APPAREL/RUN/issues) to make sure someone else has not already reported the same thing.

  - type: textarea
    id: description
    attributes:
      label: "Description"
      description: "A clear and concise description of what the bug is."
      placeholder: "When navigating to the product 3D configurator, the canvas fails to mount..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce"
      description: "Step-by-step instructions on how to trigger the bug."
      placeholder: |
        1. Start the server with `npm run dev`
        2. Navigate to `http://localhost:5002/products/speed-suit`
        3. Click on the 3D viewer interaction tab
        4. See the console error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen?"
      placeholder: "The 3D viewer should progressively stream the glTF model and enable rotation."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "Actual Behavior & Error Logs"
      description: "Include error output, stack traces, screenshots, or console logs."
      placeholder: "Error output from terminal or browser devtools console..."
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: "Affected Subsystem"
      description: "Which part of the monorepo is affected?"
      options:
        - "Frontend (Client / React 19 / Vite 8)"
        - "Backend (Server / Express 5 / Drizzle)"
        - "3D Model Viewer / GSAP Motion"
        - "Admin Dashboard (/admin/*)"
        - "Shared Types / Schemas (@run-remix/shared)"
        - "CI/CD / Workflows / Docker"
        - "Other"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: "Node.js Version"
      description: "Run `node --version` (must be Node 24+)"
      placeholder: "v24.15.0"
    validations:
      required: true

  - type: input
    id: browser-os
    attributes:
      label: "Browser & OS"
      description: "e.g., Chrome 128 on macOS / Firefox 129 on Ubuntu"
      placeholder: "Chrome 128 / macOS Sequoia"
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: "Integrity Checklist"
      description: "Please confirm that you have checked the following:"
      options:
        - label: "I am running the application on port 5002 (never 3000)."
          required: true
        - label: "I have searched existing issues to ensure this is not a duplicate."
          required: true
        - label: "I have run `npm run verify:tech-integrity` or tested on a clean clone."
          required: false
